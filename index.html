<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Parkour 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f0c20; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        .glass-panel { background: rgba(15, 12, 32, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.2); }
        input[type=range] { accent-color: #00ffff; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 4px; }
    </style>
</head>
<body class="text-white">

    <!-- UI Overlay (Main Menu) -->
    <div id="ui-layer" class="absolute inset-0 z-10 flex items-center justify-center bg-[#0f0c20]/90">
        <div class="glass-panel p-8 rounded-2xl shadow-[0_0_40px_rgba(0,255,255,0.1)] w-full max-w-md text-center flex flex-col gap-6">
            <h1 class="text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)] mb-2">NEON RUN</h1>
            
            <div id="menu-login" class="flex flex-col gap-4">
                <h2 class="text-lg text-cyan-200 mb-2">Create or Load Profile</h2>
                <input type="text" id="login-name" placeholder="Enter Username" class="w-full bg-black/50 border border-cyan-500 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-300 text-center text-xl font-bold">
                <button onclick="login()" class="py-3 px-6 rounded-lg font-bold bg-gradient-to-r from-green-600 to-green-400 hover:from-green-500 hover:to-green-300 transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)] text-lg mt-2">Sign In</button>
            </div>

            <div id="menu-home" class="hidden flex-col gap-4">
                <div class="bg-black/40 p-4 rounded-lg border border-cyan-500/50 flex justify-between items-center mb-2">
                    <div class="text-left">
                        <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">Player</div>
                        <div id="display-name" class="text-lg font-bold text-white">Name</div>
                    </div>
                    <div class="text-center">
                        <div class="text-[10px] text-yellow-400 font-bold uppercase tracking-wider">Coins</div>
                        <div id="display-coins" class="text-lg font-bold text-white">0</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">High Score</div>
                        <div id="display-highscore" class="text-lg font-bold text-white">0</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="startGame('single')" class="py-3 px-2 rounded-lg font-bold bg-gradient-to-r from-cyan-600 to-cyan-400 hover:from-cyan-500 hover:to-cyan-300 transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)]">Singleplayer</button>
                    <button onclick="showMenu('menu-multi')" class="py-3 px-2 rounded-lg font-bold bg-gradient-to-r from-purple-600 to-purple-400 hover:from-purple-500 hover:to-purple-300 transition-all shadow-[0_0_15px_rgba(168,85,247,0.4)]">Multiplayer</button>
                </div>
                
                <button onclick="openShop()" class="py-3 px-6 rounded-lg font-bold bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 transition-all shadow-[0_0_15px_rgba(250,204,21,0.4)] text-black mt-2">🛒 Shop (Colors)</button>

                <div class="mt-4 text-left">
                    <label class="block text-sm text-cyan-200 mb-2">Look Sensitivity</label>
                    <input type="range" id="sensitivity-slider" min="0.5" max="3" step="0.1" value="1.5" class="w-full">
                </div>
                
                <button onclick="logout()" class="text-sm text-gray-400 hover:text-white mt-2">← Switch Account</button>
            </div>

            <div id="menu-shop" class="hidden flex-col gap-4">
                <h2 class="text-2xl font-bold text-cyan-300 mb-2 flex justify-between items-center border-b border-cyan-800 pb-2">
                    <span>Cube Shop</span>
                    <span class="text-yellow-400 text-lg">🪙 <span id="shop-coins">0</span></span>
                </h2>
                <div class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[40vh] p-1" id="shop-items"></div>
                <button onclick="showMenu('menu-home')" class="py-2 px-6 rounded-lg font-bold bg-gray-600 hover:bg-gray-500 transition-all mt-4 border border-gray-500">Back</button>
            </div>

            <div id="menu-multi" class="hidden flex-col gap-4">
                <button onclick="hostGame()" class="py-3 px-6 rounded-lg font-bold border border-purple-400 text-purple-300 hover:bg-purple-400/20 transition-all">Host Room</button>
                <div class="flex gap-2">
                    <input type="text" id="join-id" placeholder="Enter Host ID" class="w-full bg-black/50 border border-purple-500 rounded-lg px-4 py-2 text-white outline-none focus:border-cyan-400">
                    <button onclick="joinGame()" class="py-2 px-4 rounded-lg font-bold bg-purple-600 hover:bg-purple-500 transition-all">Join</button>
                </div>
                <div id="mp-status" class="text-sm text-cyan-300 min-h-[1.5rem]"></div>
                <button onclick="showMenu('menu-home')" class="text-sm text-gray-400 hover:text-white mt-2">← Back</button>
            </div>
        </div>
    </div>

    <!-- Pause/HUD -->
    <div id="pause-menu" class="absolute inset-0 z-20 hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-sm text-center flex flex-col gap-4">
            <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-4">PAUSED</h2>
            <button onclick="resumeGame()" class="py-3 px-6 rounded-lg font-bold bg-purple-600 hover:bg-purple-500 transition-all text-white">Resume</button>
            <button onclick="quitGame()" class="py-3 px-6 rounded-lg font-bold bg-red-600/80 hover:bg-red-500 transition-all text-white border border-red-500">Quit</button>
        </div>
    </div>

    <div id="hud" class="absolute inset-0 z-0 pointer-events-none hidden">
        <div class="absolute top-4 left-4 bg-black/50 px-4 py-2 rounded text-cyan-300 text-sm border border-cyan-800 hidden" id="peer-id-display"></div>
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/60 px-6 py-2 rounded-full border border-cyan-500/50 flex gap-6 shadow-[0_0_15px_rgba(0,255,255,0.2)]">
            <div class="text-white font-bold"><span class="text-yellow-400 mr-2">🪙</span><span id="hud-coins">0</span></div>
            <div class="text-white font-bold"><span class="text-purple-400 mr-2">Score:</span><span id="hud-score">0</span></div>
        </div>
        <div id="leaderboard" class="absolute top-4 right-4 bg-black/60 p-4 rounded text-white text-sm border border-purple-500/50 hidden min-w-[150px]">
            <h3 class="font-bold text-purple-400 mb-2 border-b border-purple-500/50 pb-1 text-xs">PLAYERS</h3>
            <ul id="leaderboard-list" class="flex flex-col gap-1.5 font-medium"></ul>
        </div>
        <div class="absolute flex items-center justify-center inset-0">
            <div class="w-1.5 h-1.5 bg-white rounded-full opacity-50"></div>
        </div>
    </div>

    <div id="name-tags-container" class="absolute inset-0 z-0 pointer-events-none"></div>

    <script>
        // --- CONFIG & STATE ---
        const config = { gravity: -35, jumpForce: 18, moveSpeed: 12, playerSize: { w: 0.6, h: 1.2, d: 0.6 } };
        const state = {
            isPlaying: false, playerName: '', sensitivity: 1.5, keys: {}, yaw: 0, pitch: 0,
            velocity: new THREE.Vector3(), canJump: false, lastNetSend: 0,
            totalCoins: 0, highScore: 0, currentScore: 0,
            unlockedColors: ['#00ffff'], equippedColor: '#00ffff',
            lastSentPos: new THREE.Vector3(), lastSentYaw: 0,
            lastCheckpoint: new THREE.Vector3(0, 5, 0) // Track last black platform position
        };

        const shopItems = [
            { id: 'cyan', name: 'Default Cyan', color: '#00ffff', price: 0 },
            { id: 'pink', name: 'Neon Pink', color: '#ff00ff', price: 50 },
            { id: 'green', name: 'Lime Green', color: '#00ff00', price: 100 },
            { id: 'yellow', name: 'Golden', color: '#ffaa00', price: 250 },
            { id: 'red', name: 'Crimson', color: '#ff0033', price: 500 },
            { id: 'white', name: 'Pure Light', color: '#ffffff', price: 1000 }
        ];

        // --- SAVE SYSTEM ---
        function login() {
            const name = document.getElementById('login-name').value.trim();
            if(!name) return;
            state.playerName = name;
            const savedData = localStorage.getItem('neonRunSave_' + name);
            if(savedData) {
                const data = JSON.parse(savedData);
                state.totalCoins = data.coins || 0;
                state.highScore = data.highScore || 0;
                state.unlockedColors = data.unlockedColors || ['#00ffff'];
                state.equippedColor = data.equippedColor || '#00ffff';
                state.sensitivity = data.sensitivity || 1.5;
                document.getElementById('sensitivity-slider').value = state.sensitivity;
            } else {
                state.totalCoins = 0; state.highScore = 0; state.unlockedColors = ['#00ffff']; state.equippedColor = '#00ffff';
                saveData();
            }
            updateMenuStats();
            showMenu('menu-home');
        }

        function logout() { state.playerName = ''; showMenu('menu-login'); }

        function saveData() {
            if(!state.playerName) return;
            localStorage.setItem('neonRunSave_' + state.playerName, JSON.stringify({
                coins: state.totalCoins, highScore: state.highScore, sensitivity: state.sensitivity,
                unlockedColors: state.unlockedColors, equippedColor: state.equippedColor
            }));
        }

        function updateMenuStats() {
            document.getElementById('display-name').innerText = state.playerName;
            document.getElementById('display-coins').innerText = state.totalCoins;
            document.getElementById('display-highscore').innerText = state.highScore;
        }

        function updateHUDStats() {
            document.getElementById('hud-coins').innerText = state.totalCoins;
            document.getElementById('hud-score').innerText = state.currentScore;
        }

        function openShop() { showMenu('menu-shop'); renderShop(); }
        function renderShop() {
            const container = document.getElementById('shop-items');
            document.getElementById('shop-coins').innerText = state.totalCoins;
            container.innerHTML = '';
            shopItems.forEach(item => {
                const isUnlocked = state.unlockedColors.includes(item.color);
                const isEquipped = state.equippedColor === item.color;
                let btnHtml = isEquipped ? `<button disabled class="w-full py-1 mt-2 bg-gray-600 rounded text-xs">Equipped</button>` :
                              isUnlocked ? `<button onclick="equipColor('${item.color}')" class="w-full py-1 mt-2 bg-cyan-600 rounded text-xs">Equip</button>` :
                              `<button onclick="buyColor('${item.color}', ${item.price})" class="w-full py-1 mt-2 ${state.totalCoins >= item.price ? 'bg-green-600' : 'bg-red-900'} rounded text-xs">${item.price} 🪙</button>`;
                container.innerHTML += `<div class="bg-black/50 border ${isEquipped ? 'border-yellow-400' : 'border-gray-700'} rounded p-2 flex flex-col items-center">
                    <div class="w-8 h-8 rounded mb-1" style="background:${item.color}; box-shadow: 0 0 10px ${item.color}"></div>
                    <div class="text-[10px] font-bold">${item.name}</div>${btnHtml}</div>`;
            });
        }
        function buyColor(c, p) { if(state.totalCoins >= p) { state.totalCoins -= p; state.unlockedColors.push(c); state.equippedColor = c; saveData(); renderShop(); updateMenuStats(); } }
        function equipColor(c) { state.equippedColor = c; saveData(); renderShop(); }

        // --- MULTIPLAYER ---
        let peer = null, connections = [], isHost = false, otherPlayers = {};
        function generateShortId() { return Math.floor(10000 + Math.random() * 90000).toString(); }
        function updateLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = `<li class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:${state.equippedColor}"></div>${state.playerName}</li>`;
            for (let id in otherPlayers) list.innerHTML += `<li class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:${otherPlayers[id].lastColor}"></div>${otherPlayers[id].nameTag.innerText}</li>`;
        }
        function hostGame() {
            if (peer) return;
            peer = new Peer(generateShortId()); isHost = true;
            peer.on('open', (id) => { document.getElementById('peer-id-display').innerText = `Room ID: ${id}`; document.getElementById('mp-status').innerHTML = `Lobby ID: <span class="text-white font-mono">${id}</span>`; });
            peer.on('connection', (c) => { connections.push(c); setupConnection(c); if (!state.isPlaying) setTimeout(() => startGame('multi'), 500); });
        }
        function joinGame() {
            const hostId = document.getElementById('join-id').value.trim();
            if (!hostId || peer) return;
            peer = new Peer(); isHost = false;
            peer.on('open', () => { const c = peer.connect(hostId); connections.push(c); setupConnection(c); c.on('open', () => setTimeout(() => startGame('multi'), 500)); });
        }
        function setupConnection(c) {
            c.on('data', (d) => {
                if (d.type === 'state') { updateOtherPlayer(d); if (isHost) broadcast(d, c.peer); }
                else if (d.type === 'disconnect') { removePlayer(d.id); if (isHost) broadcast(d, c.peer); }
            });
            c.on('close', () => { connections = connections.filter(con => con.peer !== c.peer); removePlayer(c.peer); if (isHost) broadcast({ type: 'disconnect', id: c.peer }); });
        }
        function broadcast(d, skip = null) { connections.forEach(c => { if (c.open && c.peer !== skip) c.send(d); }); }
        function removePlayer(id) { if (otherPlayers[id]) { scene.remove(otherPlayers[id].mesh); otherPlayers[id].nameTag.remove(); delete otherPlayers[id]; updateLeaderboard(); } }
        function createPlayerMesh(cHex) {
            const g = new THREE.Group(); const color = new THREE.Color(cHex);
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
            const glowMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1.5 });
            const boxGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const cube = new THREE.Mesh(boxGeo, darkMat); cube.castShadow = true;
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: color }));
            cube.add(edges);
            const v = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), glowMat); v.position.set(0, 0.1, -0.3); cube.add(v);
            g.add(cube); g.userData = { innerCube: cube, roll: 0, lastY: 0, glowMat, edgesMat: edges.material };
            return g;
        }
        function updateOtherPlayer(d) {
            const cHex = d.color || '#00ffff';
            if (!otherPlayers[d.id]) {
                const m = createPlayerMesh(cHex); scene.add(m);
                const tag = document.createElement('div');
                tag.className = 'absolute text-white font-bold text-[10px] bg-black/60 px-1 rounded pointer-events-none transform -translate-x-1/2';
                tag.innerText = d.name || 'Player'; document.getElementById('name-tags-container').appendChild(tag);
                otherPlayers[d.id] = { mesh: m, targetPos: new THREE.Vector3(d.x, d.y, d.z), targetYaw: d.yaw, nameTag: tag, lastColor: cHex };
                updateLeaderboard();
            }
            const p = otherPlayers[d.id]; p.targetPos.set(d.x, d.y, d.z); p.targetYaw = d.yaw;
            if (p.lastColor !== cHex) {
                const c = new THREE.Color(cHex); p.mesh.userData.glowMat.color.copy(c); p.mesh.userData.glowMat.emissive.copy(c);
                p.mesh.userData.edgesMat.color.copy(c); p.lastColor = cHex; updateLeaderboard();
            }
        }

        // --- THREE.JS ---
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f0c20); scene.fog = new THREE.FogExp2(0x0f0c20, 0.015);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const dl = new THREE.DirectionalLight(0x00ffff, 0.6); dl.position.set(50, 100, 50); dl.castShadow = true; scene.add(dl);

        const platforms = [], collectibles = [];
        const levelData = [
            { p: [0, 0, 0], s: [10, 1, 10], c: 0x222222 }, { p: [0, 2, -15], s: [4, 1, 4], c: 0x00ffff },
            { p: [8, 4, -20], s: [4, 1, 4], c: 0xff00ff }, { p: [15, 6, -12], s: [3, 1, 3], c: 0x00ffff },
            { p: [25, 8, -12], s: [6, 1, 6], c: 0x222222 }, { p: [25, 10, -25], s: [2, 1, 2], c: 0xff00ff },
            { p: [25, 12, -35], s: [2, 1, 2], c: 0x00ffff }, { p: [15, 14, -40], s: [3, 1, 3], c: 0xff00ff },
            { p: [0, 16, -40], s: [6, 1, 6], c: 0x222222 }, { p: [-12, 18, -45], s: [3, 1, 3], c: 0x00ffff },
            { p: [-20, 20, -55], s: [2, 1, 10], c: 0xff00ff }, { p: [-10, 22, -65], s: [3, 1, 3], c: 0x00ffff },
            { p: [0, 25, -70], s: [4, 1, 4], c: 0xff00ff }, { p: [15, 27, -70], s: [3, 1, 3], c: 0x00ffff },
            { p: [30, 28, -75], s: [8, 1, 8], c: 0x222222 }, { p: [30, 30, -90], s: [2, 1, 2], c: 0xff00ff },
            { p: [20, 32, -95], s: [2, 1, 2], c: 0x00ffff }, { p: [10, 34, -100], s: [2, 1, 2], c: 0xff00ff },
            { p: [0, 36, -110], s: [4, 1, 4], c: 0x00ffff }, { p: [-15, 38, -115], s: [3, 1, 3], c: 0xff00ff },
            { p: [-30, 40, -125], s: [12, 1, 12], c: 0x00ff00 }
        ];

        levelData.forEach(d => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(d.s[0], d.s[1], d.s[2]), new THREE.MeshStandardMaterial({ color: d.c, roughness: 0.1, metalness: 0.5, emissive: d.c === 0x222222 ? 0 : d.c, emissiveIntensity: 0.4 }));
            m.position.set(d.p[0], d.p[1], d.p[2]); m.receiveShadow = true; m.castShadow = true; scene.add(m); 
            // Save if this platform is a checkpoint
            platforms.push({ box: new THREE.Box3().setFromObject(m), isCheckpoint: d.c === 0x222222 });
            if(d.c !== 0x222222) {
                const c = new THREE.Mesh(new THREE.OctahedronGeometry(0.3), new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xffaa00 }));
                c.position.set(d.p[0], d.p[1] + 1.5, d.p[2]); scene.add(c); collectibles.push({ mesh: c, active: true, startY: d.p[1] + 1.5 });
            }
        });

        const playerBox = new THREE.Box3();
        function checkCollisions(pos, axis) {
            const pad = 0.01; const yPad = axis !== 'y' ? 0.05 : 0;
            playerBox.min.set(pos.x - config.playerSize.w/2 + pad, pos.y - config.playerSize.h/2 + yPad, pos.z - config.playerSize.d/2 + pad);
            playerBox.max.set(pos.x + config.playerSize.w/2 - pad, pos.y + config.playerSize.h/2 - yPad, pos.z + config.playerSize.d/2 - pad);
            for(let p of platforms) {
                if(playerBox.intersectsBox(p.box)) {
                    if(axis === 'y') { 
                        if(state.velocity.y < 0) { 
                            pos.y = p.box.max.y + config.playerSize.h/2; 
                            state.canJump = true; 
                            // Set checkpoint when landing on a black platform
                            if(p.isCheckpoint) state.lastCheckpoint.copy(pos);
                        } else if(state.velocity.y > 0) pos.y = p.box.min.y - config.playerSize.h/2; 
                        state.velocity.y = 0; 
                    }
                    else if(axis === 'x') { pos.x = state.velocity.x > 0 ? p.box.min.x - config.playerSize.w/2 : p.box.max.x + config.playerSize.w/2; state.velocity.x = 0; }
                    else if(axis === 'z') { pos.z = state.velocity.z > 0 ? p.box.min.z - config.playerSize.d/2 : p.box.max.z + config.playerSize.d/2; state.velocity.z = 0; }
                    return true;
                }
            }
            return false;
        }

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.1);
            if (state.isPlaying) {
                const ts = state.sensitivity * 2 * dt;
                if (state.keys['arrowleft']) state.yaw += ts; if (state.keys['arrowright']) state.yaw -= ts;
                if (state.keys['arrowup']) state.pitch += ts; if (state.keys['arrowdown']) state.pitch -= ts;
                state.pitch = Math.max(-1.5, Math.min(1.5, state.pitch)); camera.rotation.set(state.pitch, state.yaw, 0, 'YXZ');
                const d = new THREE.Vector3();
                if (state.keys['w']) d.z -= 1; if (state.keys['s']) d.z += 1; if (state.keys['a']) d.x -= 1; if (state.keys['d']) d.x += 1;
                d.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw);
                state.velocity.x = d.x * config.moveSpeed; state.velocity.z = d.z * config.moveSpeed;
                if (state.keys[' '] && state.canJump) { state.velocity.y = config.jumpForce; state.canJump = false; }
                state.velocity.y += config.gravity * dt;
                const next = camera.position.clone(); state.canJump = false;
                next.y += state.velocity.y * dt; checkCollisions(next, 'y'); camera.position.y = next.y;
                next.x += state.velocity.x * dt; checkCollisions(next, 'x'); camera.position.x = next.x;
                next.z += state.velocity.z * dt; checkCollisions(next, 'z'); camera.position.z = next.z;
                
                collectibles.forEach(c => {
                    if (c.active) {
                        c.mesh.rotation.y += dt * 3; c.mesh.position.y = c.startY + Math.sin(Date.now()*0.005)*0.2;
                        if (camera.position.distanceTo(c.mesh.position) < 1.2) {
                            c.active = false; c.mesh.visible = false; state.currentScore += 100; state.totalCoins += 1;
                            if (state.currentScore > state.highScore) state.highScore = state.currentScore;
                            saveData(); updateHUDStats();
                        }
                    }
                });
                // Check fall distance
                if (camera.position.y < -10) { 
                    state.currentScore = 0; updateHUDStats(); 
                    collectibles.forEach(c=>{c.active=true;c.mesh.visible=true;}); 
                    // Respawn at last checkpoint
                    camera.position.copy(state.lastCheckpoint); 
                    state.velocity.set(0,0,0); 
                }

                // Optimized Networking
                if (connections.length > 0 && peer) {
                    const now = Date.now();
                    const moved = camera.position.distanceTo(state.lastSentPos) > 0.05 || Math.abs(state.yaw - state.lastSentYaw) > 0.05;
                    if (now - state.lastNetSend > 50 && moved) {
                        broadcast({ type: 'state', id: peer.id, name: state.playerName, color: state.equippedColor, x: camera.position.x, y: camera.position.y, z: camera.position.z, yaw: state.yaw });
                        state.lastNetSend = now; state.lastSentPos.copy(camera.position); state.lastSentYaw = state.yaw;
                    }
                }
            }

            for(let id in otherPlayers) {
                const p = otherPlayers[id]; const dist = Math.hypot(p.targetPos.x - p.mesh.position.x, p.targetPos.z - p.mesh.position.z);
                p.mesh.position.lerp(p.targetPos, 0.15); p.mesh.rotation.y += (p.targetYaw - p.mesh.rotation.y) * 0.15;
                const ud = p.mesh.userData;
                if (dist > 0.02) { ud.roll -= dist * 3; ud.innerCube.rotation.x = ud.roll; }
                const dy = p.mesh.position.y - ud.lastY;
                if (Math.abs(dy) > 0.05) ud.innerCube.scale.lerp(new THREE.Vector3(0.8, 1.3, 0.8), 0.2);
                else ud.innerCube.scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
                ud.lastY = p.mesh.position.y;
                if (p.nameTag) {
                    const sp = p.mesh.position.clone(); sp.y += 0.8; sp.project(camera);
                    if (sp.z > 1) p.nameTag.style.display = 'none';
                    else { p.nameTag.style.display = 'block'; p.nameTag.style.left = `${(sp.x*0.5+0.5)*window.innerWidth}px`; p.nameTag.style.top = `${(sp.y*-0.5+0.5)*window.innerHeight}px`; }
                }
            }
            renderer.render(scene, camera);
        }

        function showMenu(id) {
            ['menu-login', 'menu-home', 'menu-multi', 'menu-shop'].forEach(m => document.getElementById(m).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden'); if(id !== 'menu-shop') document.getElementById(id).classList.add('flex');
        }
        function startGame(m) { 
            document.getElementById('ui-layer').classList.add('hidden'); 
            document.getElementById('hud').classList.remove('hidden'); 
            state.isPlaying = true; 
            state.lastCheckpoint.set(0, 5, 0); // Reset checkpoint to start for new game
            if(m==='multi'){document.getElementById('peer-id-display').classList.remove('hidden');document.getElementById('leaderboard').classList.remove('hidden');updateLeaderboard();}}
        function pauseGame() { state.isPlaying = false; document.getElementById('pause-menu').classList.remove('hidden'); document.getElementById('pause-menu').classList.add('flex'); }
        function resumeGame() { state.isPlaying = true; document.getElementById('pause-menu').classList.add('hidden'); state.keys = {}; }
        function quitGame() { location.reload(); }

        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') pauseGame(); if(state.isPlaying) state.keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { state.keys[e.key.toLowerCase()] = false; });
        document.getElementById('sensitivity-slider').addEventListener('input', (e) => { state.sensitivity = parseFloat(e.target.value); saveData(); });
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
</html>
